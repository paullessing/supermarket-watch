services:
  api:
    build:
      context: ./
      dockerfile: docker/dev.Dockerfile
    command: 'sh -c "npm install && npm run dev -- --host 0.0.0.0"'
    depends_on:
      mongo:
        condition: service_healthy
        restart: true
      proxy:
        condition: service_healthy
        restart: false
    environment:
      NODE_ENV: dev
      TESCO_URL: http://proxy:3333/tesco/
      SAINSBURYS_URL: http://proxy:3333/sainsburys/
      MONGODB_HOST: mongo
      SEARCH_RESULT_COUNT: ${SEARCH_RESULT_COUNT:-36}
      RUN_MIGRATION: ${RUN_MIGRATION:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
    ports:
      - ${PORT:-5173}:5173
    networks:
      webnet:
      mongo_network:
      proxy_network:
    volumes:
      - ./node_modules:/usr/src/app/node_modules
      - ./.svelte-kit:/usr/src/app/.svelte-kit
      - ./package.json:/usr/src/app/package.json:ro
      - ./package-lock.json:/usr/src/app/package-lock.json
      - ./svelte.config.js:/usr/src/app/svelte.config.js:ro
      - ./tsconfig.json:/usr/src/app/tsconfig.json:ro
      - ./vite.config.ts:/usr/src/app/vite.config.ts:ro
      - ./src:/usr/src/app/src:ro
      - ./static:/usr/src/app/static:ro
    restart: on-failure
  proxy:
    build:
      context: ./
      dockerfile: docker/proxy.Dockerfile
    expose:
      - 3333
    ports:
      - '3333:3333'
    volumes:
      - ./proxy/proxy.js:/usr/src/app/proxy.js
    restart: always
    networks:
      proxy_network:
    healthcheck:
      test: >
        node -e "fetch('http://localhost:3333/health')
          .then(res => res.text())
          .then(text => process.exit(text === 'ALLOK' ? 0: 1))
          .catch(e => { console.error(e); process.exit(1); })"
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 10s

  mongo:
    image: mongo:5
    command: mongod --quiet --logpath /dev/null
    restart: always
    expose:
      - 27017
    ports:
      - '27017:27017'
    networks:
      mongo_network:
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/shopping --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s

networks:
  webnet:
    external: true
  mongo_network:
  proxy_network:
